name: APK Android

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Dependências
        run: npm ci

      - name: Conferências
        run: |
          npm run typecheck
          npm run lint
          npm run conferir

      - name: Projeto Android
        run: npx expo prebuild -p android --no-install
        env:
          CI: "1"

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk Calo-${{ github.ref_name == 'main' && 'teste' || github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Calo-apk
          path: Calo-*.apk

      - name: Publicar na Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'teste' }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Calo $TAG" --notes "APK de teste do Calo para Android. Baixe o arquivo .apk no celular e abra para instalar (o Android pede para permitir apps de fora da Play Store)." --prerelease
          gh release upload "$TAG" Calo-*.apk --clobber
